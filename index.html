<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Compétences</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #050812 100%);
            color: #e0e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 2em;
            color: #d4af37;
        }

        h1 {
            font-size: 2.5em;
            color: #d4af37;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        .btn-link {
            padding: 10px 20px;
            background: rgba(74, 158, 255, 0.2);
            border: 2px solid #4a9eff;
            color: #4a9eff;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            font-weight: 600;
        }

        .btn-link:hover {
            background: rgba(74, 158, 255, 0.3);
            transform: translateY(-2px);
        }

        /* SECTION PROFIL */
        .profile-section {
            background: linear-gradient(135deg, rgba(15, 20, 41, 0.8), rgba(10, 14, 39, 0.8));
            border: 2px solid #1a1f3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            display: none;
        }

        .profile-section.active {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 30px;
            align-items: center;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            border-radius: 12px;
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #d4af37;
        }

        .info-label {
            color: #a8b3d0;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #d4af37;
            font-size: 1.3em;
            font-weight: 700;
        }

        /* SEARCH SECTION */
        .search-section {
            background: linear-gradient(135deg, rgba(15, 20, 41, 0.8), rgba(10, 14, 39, 0.8));
            border: 2px solid #1a1f3a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #a8b3d0;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #1a1f3a;
            border-radius: 6px;
            color: #e0e8ff;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.1);
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.2);
        }

        .btn-search {
            padding: 12px 28px;
            background: linear-gradient(135deg, #4a9eff, #3b82f6);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-search:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(74, 158, 255, 0.3);
        }

        .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* TALENT TREE SECTION */
        .talents-section {
            background: linear-gradient(135deg, rgba(15, 20, 41, 0.8), rgba(10, 14, 39, 0.8));
            border: 2px solid #1a1f3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: none;
        }

        .talents-section.active {
            display: block;
        }

        .talents-section h2 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .talent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .talent-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            border: 2px solid #1a1f3a;
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .talent-card:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        .talent-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8b5cf6, #4a9eff);
            border-radius: 8px;
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            margin: 0 auto 10px;
        }

        .talent-name {
            color: #d4af37;
            font-weight: 700;
            font-size: 0.9em;
            margin-bottom: 6px;
        }

        .talent-desc {
            color: #a8b3d0;
            font-size: 0.8em;
            line-height: 1.4;
        }

        .talent-level {
            color: #a8b3d0;
            font-size: 0.75em;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .talent-card.learned {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
        }

        .talent-card.learned .talent-icon {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
        }

        .talent-card.learned::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            color: #10b981;
            font-weight: 700;
            font-size: 1.3em;
        }

        /* MESSAGES */
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
            border-left: 4px solid;
            font-weight: 500;
        }

        .message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #6ee7b7;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a8b3d0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-section.active {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .talent-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }

            .search-section {
                flex-direction: column;
            }

            .form-group {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div class="logo">🌿</div>
                <h1>ARBRE DE COMPÉTENCES</h1>
            </div>
            <div class="header-right">
                <a href="https://murloc.io/rankings/us/dps" target="_blank" class="btn-link">⚔️ TOP DPS</a>
                <a href="https://murloc.io/rankings/us/healer" target="_blank" class="btn-link">💚 TOP HEAL</a>
                <a href="https://murloc.io/rankings/us/tank" target="_blank" class="btn-link">🛡️ TOP TANK</a>
            </div>
        </header>

        <!-- MESSAGES -->
        <div id="messageSuccess" class="message success"></div>
        <div id="messageError" class="message error"></div>

        <!-- SEARCH SECTION -->
        <div class="search-section">
            <div class="form-group" style="flex: 1;">
                <label for="realm">Realm</label>
                <input type="text" id="realm" placeholder="area52" value="">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="character">Personnage</label>
                <input type="text" id="character" placeholder="diviciacos" value="">
            </div>
            <button class="btn-search" onclick="loadCharacterData()">Charger</button>
        </div>

        <!-- PROFILE SECTION -->
        <div id="profileSection" class="profile-section">
            <div class="profile-icon" id="profileIcon">🎮</div>
            <div class="profile-info">
                <div class="info-item">
                    <div class="info-label">Nom</div>
                    <div class="info-value" id="charName">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Classe</div>
                    <div class="info-value" id="charClass">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Spécialisation</div>
                    <div class="info-value" id="charSpec">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Niveau</div>
                    <div class="info-value" id="charLevel">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Realm</div>
                    <div class="info-value" id="charRealm">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Raider Score</div>
                    <div class="info-value" id="charScore">-</div>
                </div>
            </div>
        </div>

        <!-- TALENTS SECTION -->
        <div id="talentsSection" class="talents-section">
            <h2>⚡ Talents & Compétences</h2>
            <div class="talent-grid" id="talentGrid">
                <div class="empty-state">Chargement des talents...</div>
            </div>
        </div>

        <!-- EMPTY STATE -->
        <div id="emptyState" class="empty-state">
            <p style="font-size: 1.2em; margin-bottom: 10px;">📊 Entrez vos identifiants</p>
            <p>Exemple: area52 - diviciacos</p>
        </div>
    </div>

        function showMessage(text, type) {
            const element = document.getElementById(`message${type === 'success' ? 'Success' : 'Error'}`);
            element.textContent = text;
            element.classList.add('show');
            setTimeout(() => element.classList.remove('show'), 5000);
        }

        async function loadCharacterData() {
            const realm = document.getElementById('realm').value.trim();
            const character = document.getElementById('character').value.trim();

            if (!realm || !character) {
                showMessage('❌ Veuillez entrer le realm et le personnage', 'error');
                return;
            }

            const btn = event.target;
            btn.innerHTML = '<span class="loading-spinner"></span> Chargement...';
            btn.disabled = true;

            try {
                // Appel API Raider.IO
                const response = await fetch(
                    `https://raider.io/api/v1/characters/profile?region=eu&realm=${encodeURIComponent(realm)}&name=${encodeURIComponent(character)}&fields=profile,mythic_plus_scores`
                );

                if (!response.ok) throw new Error('Personnage non trouvé');

                const data = await response.json();

                // Mettre à jour le profil
                updateProfile(data);

                // Charger les talents
                loadTalents(data);

                showMessage(`✅ ${data.name} chargé avec succès!`, 'success');

            } catch (error) {
                showMessage(`❌ Erreur: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = 'Charger';
                btn.disabled = false;
            }
        }

        function updateProfile(data) {
            document.getElementById('charName').textContent = data.name;
            document.getElementById('charClass').textContent = data.class;
            document.getElementById('charLevel').textContent = data.level;
            document.getElementById('charRealm').textContent = data.realm;
            document.getElementById('charScore').textContent = (data.mythic_plus_scores?.all || 0).toFixed(1);

            // Icône par classe
            const classIcons = {
                'Druid': '🐉',
                'Warrior': '⚔️',
                'Priest': '📿',
                'Rogue': '🗡️',
                'Hunter': '🏹',
                'Mage': '🪄',
                'Warlock': '💜',
                'Paladin': '⚖️',
                'Shaman': '⚡',
                'Monk': '🥋',
                'Demon Hunter': '👹',
                'Death Knight': '💀'
            };

            document.getElementById('profileIcon').textContent = classIcons[data.class] || '🎮';
            document.getElementById('profileSection').classList.add('active');
            document.getElementById('emptyState').style.display = 'none';
        }

        function loadTalents(data) {
            const classKey = data.class.toLowerCase().replace(' ', '_');
            const specs = TALENTS_DATA[classKey] || {};
            const spec = data.active_spec.name.toLowerCase().replace(/\s+/g, '_');
            const talents = specs[spec] || Object.values(specs)[0] || [];

            const grid = document.getElementById('talentGrid');
            grid.innerHTML = '';

            if (talents.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1;">Talents non disponibles pour cette spécialisation</p>';
                return;
            }

            talents.forEach((talent, idx) => {
                const card = document.createElement('div');
                card.className = 'talent-card';
                card.innerHTML = `
                    <div class="talent-icon">${talent.icon}</div>
                    <div class="talent-name">${talent.name}</div>
                    <div class="talent-desc">${talent.desc}</div>
                    <div class="talent-level">Rang ${Math.min(Math.floor(data.level / 10), 3)}</div>
                `;
                card.addEventListener('click', () => card.classList.toggle('learned'));
                grid.appendChild(card);
            });

            document.getElementById('charSpec').textContent = data.active_spec.name;
            document.getElementById('talentsSection').classList.add('active');
        }

        // Auto-load avec des paramètres par défaut
        window.addEventListener('load', () => {
            document.getElementById('realm').value = 'area52';
            document.getElementById('character').value = 'diviciacos';
            loadCharacterData();
        });
    </script>
</body>
</html>
